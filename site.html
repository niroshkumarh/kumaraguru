<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kumaraguru Filled Loader</title>
  <style>
    body {
      margin: 0;
      background: #0d1b2a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .loader-container {
      width: 180px;
      height: 180px;
      animation: pulseGlow 2.5s infinite ease-in-out;
      background: radial-gradient(circle at center, #0077b6, #023e8a);
      padding: 20px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 30px #00d9ff88;
    }

    .loader-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation: innerPulse 3s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 30px #00d9ff88;
        background: radial-gradient(circle at center, #0077b6, #023e8a);
      }
      50% {
        transform: scale(1.1);
        box-shadow: 0 0 50px #00d9ffcc;
        background: radial-gradient(circle at center, #00b4d8, #0077b6);
      }
    }

    @keyframes innerPulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.8;
      }
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <img src="file.svg" alt="Kumaraguru Logo Loader">
  </div>

</body>
</html>
